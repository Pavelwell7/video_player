<!DOCTYPE html>
<html lang="en">
<head>
  <title>Пример подключения плеера</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="css/font-awesome.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
  <div id="player" class="player-container">
    <div class="js-video-container video-container"></div>
      <div class="controls-bar">
        <button class="js-play-button controls-btn"><i class="fa fa-play" aria-hidden="true"></i></button>
        <button class="js-pause-button controls-btn" hidden><i class="fa fa-pause" aria-hidden="true"></i></button>
        <button class="js-volume-button controls-btn"><i class="fa fa-volume-off" aria-hidden="true"></i></button>
        <button class="js-mute-button controls-btn" hidden><i class="fa fa-volume-up" aria-hidden="true"></i></button>
        <div class="js-current-time viewing-panel"></div>
        <div class="js-progress progress-static-bar">
          <div class="js-progress-slider progress-dynamic-bar"></div>
          <div class="dot"></div>
        </div>
        <div class="js-duration viewing-panel"></div>
        <button class="js-fullscreen-button controls-btn"><i class="fa fa-expand" aria-hidden="true"></i></button>
     </div>


  </div>
  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
  <script src="player.js"></script>

  <script type="text/javascript">
    createPlayer({elementId: 'player'});
</script>
</body>
</html>
